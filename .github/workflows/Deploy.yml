name: Deploy sm64js

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 13
        uses: actions/setup-node@v4
        with:
          node-version: '13'

      - name: Clone sm64js source
        run: git clone https://github.com/sm64js/sm64js.git

      - name: Install dependencies
        working-directory: sm64js
        run: npm install

      - name: Build
        working-directory: sm64js
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: sm64js/dist
